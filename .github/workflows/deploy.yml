name: Deploy (Netlify)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sürüm numarası (v1.<commit sayısı>) için tüm geçmiş
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Testler kırılırsa yayın yapılmaz, site eski haliyle kalır (senaryo + simülatör + 60 rastgele yarış)
      - run: npm run check
      - run: node scripts/build.mjs
      # Sesli anlatım MP3'leri (scripts/tts.mjs): metin değişmedikçe önbellekten, anahtar yalnız burada
      - uses: actions/cache@v4
        with:
          path: .tts-cache
          key: tts-${{ github.run_id }}
          restore-keys: tts-
      - name: ffmpeg (Gemini sesini MP3'e çevirmek için)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Sesli anlatım
        timeout-minutes: 40
        run: node scripts/tts.mjs
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          GEMINI_TTS_KEY: ${{ secrets.GEMINI_TTS_KEY }}
      # Netlify'a yayın (derleme burada yapılır, Netlify yalnız dist'i alır; Netlify derleme dakikası harcanmaz).
      # Gizli anahtarlar: Settings → Secrets and variables → Actions → NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
      - name: Netlify'a yayınla
        run: npx --yes netlify-cli@17 deploy --prod --dir=dist --message "v1.$(git rev-list --count HEAD) $(git rev-parse --short HEAD)"

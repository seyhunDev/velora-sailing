<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Velora">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Velora Sailing · Taktik oluştur</title>
  <link rel="icon" href="img/velora-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400..800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/taktik.css">
  <script src="js/app-shell.js"></script>
  <script src="js/datause.js"></script>
</head>
<body class="taktik acik">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-boat" viewBox="0 0 24 24"><path d="M12 3c3 3.5 4 8 3.5 15h-7C8 11 9 6.5 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-mark" viewBox="0 0 24 24"><circle cx="12" cy="15" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 10.5V3.5l6 2.2-6 2.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-line" viewBox="0 0 24 24"><circle cx="4.5" cy="14" r="2.3" fill="currentColor"/><path d="M7.5 14h9" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.6 2"/><path d="M17.5 10.5h4l-1 7h-3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-rot-l" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.1-5M5 4.5V9h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-rot-r" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5M19 4.5V9h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7 4.5 11.5 9 16M5 11.5h9a5 5 0 0 1 0 10h-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 8 12 3.5 16.5 8M5 12.5v6.5h14v-6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="4.8" cy="6.5" r="1.3" fill="currentColor"/><circle cx="4.8" cy="12" r="1.3" fill="currentColor"/><circle cx="4.8" cy="17.5" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4.5h14v15H5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-gust" viewBox="0 0 24 24"><path d="M3 9h11a3 3 0 1 0-3-3M3 14h15a3 3 0 1 1-3 3M3 19h7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </svg>

  <header class="topbar tk-top acik">
    <a class="tool back-btn" href="./" title="Ana sayfa"><svg><use href="#i-back"/></svg><span class="lbl">Ana sayfa</span></a>
    <input id="tkTitle" class="tk-title" maxlength="60" placeholder="Taktiğine ad ver" autocomplete="off" spellcheck="false" aria-label="Taktiğin adı">
    <span id="tkSaved" class="tk-saved" aria-live="polite"></span>
    <div class="spacer"></div>
    <div class="tool-group">
      <button class="tool" id="tkNote" title="Açıklama ve zamanlı notlar"><svg><use href="#i-note"/></svg><span class="lbl">Notlar</span></button>
      <button class="tool" id="tkMine" title="Kayıtlı taktiklerim"><svg><use href="#i-list"/></svg><span class="lbl">Taktiklerim</span></button>
      <button class="tool" id="tkShare" title="Bağlantıyla paylaş"><svg><use href="#i-share"/></svg><span class="lbl">Paylaş</span></button>
      <button class="tool tk-play" id="tkPlay" title="Oynat"><svg><use href="#i-play"/></svg><span class="lbl">Oynat</span></button>
    </div>
  </header>

  <main class="stage tk-stage" id="tkStage">
    <svg id="tkSvg" viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet" aria-label="Sahne">
      <rect id="tkWater" x="-2000" y="-2000" width="5000" height="5000" fill="transparent"/>
      <g id="tkWind"></g>
      <g id="tkCourse"></g>
      <g id="tkRoutes"></g>
      <g id="tkBoats"></g>
      <g id="tkHandles"></g>
    </svg>

    <!-- rüzgar göstergesi: dokun-döndür düğmeleri -->
    <div class="tk-wind" aria-label="Rüzgar">
      <button class="tk-ic" id="tkWindL" title="Rüzgarı sola döndür" aria-label="Rüzgarı sola döndür"><svg><use href="#i-rot-l"/></svg></button>
      <div class="tk-wind-mid"><svg viewBox="-20 -20 40 40" class="tk-wind-arrow"><g id="tkWindArrow"><path d="M0,-15 L0,12 M-6,5 L0,13 L6,5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
        <span><b id="tkWindDeg">0°</b><small>Rüzgar</small></span></div>
      <button class="tk-ic" id="tkWindR" title="Rüzgarı sağa döndür" aria-label="Rüzgarı sağa döndür"><svg><use href="#i-rot-r"/></svg></button>
      <button class="tk-shift" id="tkShift" title="Oynatırken rüzgar dönüşü"></button>
    </div>

    <!-- seçili nesne kartı -->
    <div class="tk-sel hidden" id="tkSel"></div>

    <!-- ipucu -->
    <div class="tk-hint" id="tkHint"></div>

    <!-- kural hakemi özeti -->
    <button class="tk-ref hidden" id="tkRef" title="Kural hakemi"></button>

    <!-- alt araç çubuğu -->
    <nav class="tk-dock" aria-label="Ekle">
      <button class="tk-btn" id="tkAddBoat"><svg><use href="#i-boat"/></svg><span>Tekne</span></button>
      <button class="tk-btn" id="tkAddMark"><svg><use href="#i-mark"/></svg><span>Şamandıra</span></button>
      <button class="tk-btn" id="tkAddGust"><svg><use href="#i-gust"/></svg><span>Sağanak</span></button>
      <button class="tk-btn" id="tkLine" aria-pressed="false"><svg><use href="#i-line"/></svg><span>Start hattı</span></button>
      <button class="tk-btn" id="tkUndo" title="Geri al"><svg><use href="#i-undo"/></svg><span>Geri al</span></button>
      <button class="tk-btn" id="tkNew"><svg><use href="#i-plus"/></svg><span>Yeni</span></button>
    </nav>

    <div class="brand-corner" aria-label="Velora Sailing"><svg viewBox="0 0 100 100"><rect width="100" height="100" rx="23" fill="#0f0f11"/><circle cx="50" cy="52" r="30" fill="#d4ff3a"/><path d="M26 19 L35.6 19 C 42 35, 46 47.8, 50 55.8 L59.6 19 L74 19 L56.4 67 L43.6 67 Z" fill="#0f0f11"/></svg><span>Velora <em>Sailing</em></span></div>
  </main>

  <!-- pencereler -->
  <div class="set-dlg hidden" id="tkDlg" role="dialog" aria-modal="true">
    <div class="set-panel acik">
      <div class="set-head"><h2 id="tkDlgTitle"></h2><button class="btn-round" id="tkDlgClose" title="Kapat (Esc)" aria-label="Kapat"><svg><use href="#i-close"/></svg></button></div>
      <div class="set-body" id="tkDlgBody"></div>
    </div>
  </div>
  <div class="tk-toast hidden" id="tkToast" role="status"></div>

  <script src="js/track.js"></script>
  <script src="js/report.js"></script>
  <script src="js/access.js"></script>
  <script src="js/user-data.js"></script>
  <script src="js/fullscreen.js"></script>
  <script type="module" src="js/velora-auth.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/boat-draw.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/gorev-data.js"></script>
  <script src="js/taktik-core.js"></script>
  <script src="js/taktik.js"></script>
</body>
</html>
